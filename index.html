<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Play Index</title>

  <link href="css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- ناقص بس اعمل السيرش  -->

  <nav class="navbar navbar-expand-lg navbar-dark main-navbar sticky-top">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <i class="bi bi-controller"></i> Play<span class="text-accent">Index</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon" aria-label="Toggle navigation"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto text-center">
          <li class="nav-item"><a href="#" class="nav-link category-link" data-category="mmorpg">MMORPG</a></li>
          <li class="nav-item"><a href="#" class="nav-link category-link" data-category="shooter">SHOOTER</a></li>
          <li class="nav-item"><a href="#" class="nav-link category-link" data-category="sailing">SAILING</a></li>
          <li class="nav-item"><a href="#" class="nav-link category-link" data-category="permadeath">PERMADEATH</a></li>
          <li class="nav-item"><a href="#" class="nav-link category-link" data-category="superhero">SUPERHERO</a></li>
          <li class="nav-item"><a href="#" class="nav-link category-link" data-category="pixel">PIXEL</a></li>
          <li class="nav-item"><a href="#" class="nav-link category-link" data-category="">ALL</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <header class="hero-section text-center">
    <div class="container">
      <h1 class="hero-title">Discover the Best <span class="text-accent">Free to Play</span> Games</h1>
      <p class="hero-sub">Comprehensive reviews and details for the best free games on PC and Browser</p>
    </div>
  </header>

  <div class="container mt-4">
    <div class="row g-3 align-items-center filters-bar">

      <div class="col-12 col-md-4">
        <label for="platformSelect" class="form-label">Platform</label>
        <select id="platformSelect" class="form-select">
          <option value="all">All Platforms</option>
          <option value="pc">PC</option>
          <option value="browser">Browser</option>
        </select>
      </div>

      <div class="col-12 col-md-4">
        <label for="sortSelect" class="form-label">Sort By</label>
        <select id="sortSelect" class="form-select">
          <option value="">Default</option>
          <option value="alphabetical">Alphabetical (A-Z)</option>
          <option value="release-date">Release Date</option>
          <option value="popularity">Most Popular</option>
          <option value="relevance">Most Relevant</option>
        </select>
      </div>

      <div class="col-12 col-md-4 text-md-end">
        <label for="activeCategoryLabel" class="form-label">Active Category</label>
        <span id="activeCategoryLabel" class="badge active-badge">Category: All</span>
      </div>

    </div>
  </div>

  <div id="loadingBox" class="text-center my-5 d-none">
    <div class="spinner-border text-accent" role="status"></div>
    <p class="mt-2">Loading...</p>
  </div>

  <div id="errorBox" class="container my-4 d-none">
    <div class="alert alert-danger text-center" role="alert"></div>
  </div>

  <main class="container my-4">
    <div id="gamesGrid" class="row g-4"></div>
  </main>

  <footer class="footer-section text-center py-4 mt-5">
    <p class="mb-0">GameReview &copy; 2026 - Game data provided by FreeToGame API</p>
  </footer>

  <script src="js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
</body>

</html>
