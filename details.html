<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Details - Game Review</title>

  <link href="css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark main-navbar sticky-top">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <i class="bi bi-controller"></i> Game<span class="text-accent">Review</span>
      </a>
      <a href="index.html" class="btn btn-outline-accent">
        <i class="bi bi-arrow-left"></i> Back to Home
      </a>
    </div>
  </nav>

  <div id="loadingBox" class="text-center my-5">
    <div class="spinner-border text-accent" role="status"></div>
    <p class="mt-2">Loading...</p>
  </div>

  <div id="errorBox" class="container my-4 d-none">
    <div class="alert alert-danger text-center" role="alert"></div>
  </div>

  <main class="container my-4 d-none" id="detailsContent">

    <div class="row g-4">
      <div class="col-12 col-lg-5">
        <img id="gameThumbnail" src="" alt="Game image" class="img-fluid rounded-4 shadow game-cover">
      </div>

      <div class="col-12 col-lg-7">
        <h1 id="gameTitle" class="fw-bold mb-3"></h1>

        <div class="d-flex flex-wrap gap-2 mb-3">
          <span id="gameGenre" class="badge tag-badge"></span>
          <span id="gamePlatform" class="badge tag-badge"></span>
          <span id="gamePublisher" class="badge tag-badge"></span>
          <span id="gameReleaseDate" class="badge tag-badge"></span>
        </div>

        <p id="gameDescription" class="game-description"></p>

        <a id="gameLink" href="#" target="_blank" class="btn btn-accent mt-3">
          <i class="bi bi-controller"></i> Play Now
        </a>
      </div>
    </div>

    <hr class="my-5">

    <h4 class="mb-3"><i class="bi bi-image"></i> Screenshots</h4>
    <div id="screenshotsRow" class="row g-3"></div>

    <hr class="my-5">

    <h4 class="mb-3"><i class="bi bi-list-check"></i> System Requirements (Minimum)</h4>
    <div id="requirementsBox" class="requirements-box"></div>

  </main>

  <footer class="footer-section text-center py-4 mt-5">
    <p class="mb-0">GameReview &copy; 2026 - Game data provided by FreeToGame API</p>
  </footer>

  <script src="js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/details.js"></script>
</body>
</html>
