<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading… | GameReview</title>

<link href="css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">

<style>
  html, body {
    height: 100%;
    overflow: hidden;
  }

  .load-screen {
    position: relative;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(180deg, #181f21 0%, var(--bg-dark) 55%, #101416 100%);
    overflow: hidden;
  }

  
  .load-screen::before {
    content: "";
    position: absolute;
    top: -120px;
    left: 50%;
    transform: translateX(-50%);
    width: 780px;
    height: 420px;
    background: radial-gradient(circle, rgba(156, 185, 168, 0.16) 0%, transparent 70%);
    pointer-events: none;
  }


  .particle {
    position: absolute;
    border-radius: 50%;
    background: var(--accent);
    opacity: 0.35;
    animation: float 7s ease-in-out infinite;
    pointer-events: none;
  }
  .particle:nth-child(1) { width: 6px;  height: 6px;  left: 12%; top: 70%; background: var(--accent);   animation-duration: 8s; }
  .particle:nth-child(2) { width: 4px;  height: 4px;  left: 22%; top: 30%; background: var(--accent-2); animation-duration: 6.5s; animation-delay: .5s; }
  .particle:nth-child(3) { width: 8px;  height: 8px;  left: 80%; top: 65%; background: var(--accent-3); animation-duration: 9s;  animation-delay: 1s; }
  .particle:nth-child(4) { width: 5px;  height: 5px;  left: 88%; top: 25%; background: var(--accent);   animation-duration: 7.5s; animation-delay: .3s; }
  .particle:nth-child(5) { width: 3px;  height: 3px;  left: 50%; top: 15%; background: var(--accent-2); animation-duration: 6s;  animation-delay: .8s; }
  .particle:nth-child(6) { width: 4px;  height: 4px;  left: 65%; top: 78%; background: var(--accent-3); animation-duration: 8.5s; animation-delay: .2s; }

  @keyframes float {
    0%, 100% { transform: translateY(0) scale(1); opacity: .35; }
    50%      { transform: translateY(-30px) scale(1.3); opacity: .8; }
  }

  .load-content {
    position: relative;
    z-index: 1;
    text-align: center;
  }

  
  .load-logo {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 2.4rem;
    color: var(--text-light);
    letter-spacing: 0.2px;
    margin-bottom: 2.2rem;
  }

  .load-logo .bi-controller {
    color: var(--accent);
    font-size: 2.1rem;
    animation: pulseIcon 1.8s ease-in-out infinite;
    filter: drop-shadow(0 0 10px rgba(156, 185, 168, 0.45));
  }

  @keyframes pulseIcon {
    0%, 100% { transform: scale(1) rotate(0deg); }
    50%      { transform: scale(1.12) rotate(-6deg); }
  }


  .ring-loader {
    position: relative;
    width: 96px;
    height: 96px;
    margin: 0 auto 1.8rem;
  }

  .ring-loader span {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 3px solid transparent;
  }

  .ring-loader span:nth-child(1) {
    border-top-color: var(--accent);
    border-right-color: var(--accent);
    animation: spin 1.1s linear infinite;
  }
  .ring-loader span:nth-child(2) {
    inset: 12px;
    border-bottom-color: var(--accent-2);
    animation: spin 1.5s linear infinite reverse;
  }
  .ring-loader span:nth-child(3) {
    inset: 24px;
    border-left-color: var(--accent-3);
    animation: spin 0.9s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .load-title {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 1.4rem;
    color: var(--text-light);
    margin-bottom: 0.4rem;
  }

  .load-sub {
    color: var(--text-muted);
    font-size: 0.95rem;
    margin-bottom: 1.6rem;
    min-height: 1.4em;
  }

  .load-sub .dots::after {
    content: '';
    animation: dots 1.4s steps(4, end) infinite;
  }
  @keyframes dots {
    0%   { content: ''; }
    25%  { content: '.'; }
    50%  { content: '..'; }
    75%  { content: '...'; }
    100% { content: ''; }
  }

  .progress-track {
    width: 260px;
    max-width: 70vw;
    height: 6px;
    border-radius: 20px;
    background-color: var(--bg-card);
    border: 1px solid rgba(156, 185, 168, 0.25);
    overflow: hidden;
    margin: 0 auto;
  }

  .progress-fill {
    height: 100%;
    width: 0%;
    border-radius: 20px;
    background: var(--gradient-power);
    animation: fillBar 2.6s ease-in-out infinite;
  }

  @keyframes fillBar {
    0%   { width: 6%; }
    50%  { width: 85%; }
    100% { width: 100%; }
  }

  .progress-pct {
    margin-top: 0.6rem;
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 0.5px;
    color: var(--accent);
  }

  .tag-badge.loader-tag {
    margin-top: 2rem;
    display: inline-block;
  }
</style>
</head>
<body>

  <div class="load-screen">
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>

    <div class="load-content">

      <div class="load-logo">
        <i class="bi bi-controller"></i>
        Game<span class="text-accent">Review</span>
      </div>

      <div class="ring-loader">
        <span></span>
        <span></span>
        <span></span>
      </div>

      <div class="load-title">Warming up the arcade</div>
      <div class="load-sub">Fetching the best free&#8209;to&#8209;play games<span class="dots"></span></div>

      <div class="progress-track">
        <div class="progress-fill"></div>
      </div>
      <div class="progress-pct" id="progressPct">Loading 0%</div>

      <span class="tag-badge loader-tag"><i class="bi bi-joystick"></i>&nbsp; Please wait</span>

    </div>
  </div>

  <script>
    // simple looping percentage readout in sync with the bar animation
    const pctEl = document.getElementById('progressPct');
    let pct = 0;
    setInterval(() => {
      pct = (pct + Math.floor(Math.random() * 9) + 3) % 101;
      pctEl.textContent = 'Loading ' + pct + '%';
    }, 260);
  </script>

</body>
</html>
